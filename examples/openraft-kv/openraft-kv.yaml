# client-proxy + kill/pause only (openraft --raft-addr is bind and advertise)
# 3-node databendlabs/openraft examples/raft-kv-memstore.
# GET is POST /linearizable_read. POST /read is the local state machine and is not called.
# The store is in memory. Not run in CI.
name: openraft-kv
binary:
  default: raft-key-value
  extra: ["./examples/openraft-kv/raft-key-value"]
topology:
  nodes: 3
  client_via_proxy: true
  data_dir: "${dir}/node${i}"
  ports:
    base: 0
    client_base: 0
    names: [raft]
  start:
    - /bin/sh
    - examples/openraft-kv/start-node.sh
    - "${i}"
    - "${dir}"
    - "${binary}"
    - "${client_port}"
    - "${port_raft}"
  ready:
    command:
      - /bin/sh
      - examples/openraft-kv/ready.sh
      - "${i}"
      - "${dir}"
      - "${client_port}"
    contains: READY
    timeout: 30s
  stop_grace: 2s
nemesis:
  warmup: 3s
  duration: 25s
  interval: 3s
  quiet_period: 5s
  actions:
    - type: isolate_client
      target: random
      mode: blackhole
      weight: 3
    - type: isolate_client
      target: random
      mode: reset
      weight: 2
    - type: kill_node
      target: random
      restart_delay: 2s
      weight: 2
    - type: pause_node
      target: random
      pause_duration: 2s
      weight: 2
    - type: heal_all
      weight: 2
workload:
  driver: http_kv
  workers: 4
  rate: 20
  keyspace: 3
  timeout: 1500ms
  targets: "${client_addrs}"
  put:
    method: POST
    url: "http://${target}/write"
    headers:
      Content-Type: application/json
    body: '{"Set":{"key":"${key}","value":"${value}"}}'
    error_from: Err
  get:
    method: POST
    url: "http://${target}/linearizable_read"
    headers:
      Content-Type: application/json
    body: '"${key}"'
    value_from: Ok.value.value
    error_from: Err
properties:
  always:
    - porcupine:
        timeout: 10s
    - set: {}
  eventually:
    - eventually_available:
        n: 5
  sometimes:
    - fault_during_inflight: {}
      min_hits: 1
    - info_ops_observed: {}
      min_hits: 1
    - fault_action_fired:
        action: kill_node
      min_hits: 1
