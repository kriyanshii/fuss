name: topology-isolate-per-node-both
binary:
  default: hold
  extra: ["./testdata/yaml/topology/hold"]
topology:
  nodes: 3
  data_dir: "${dir}/node${i}"
  ports:
    base: 0
  proxy_mode: per_node
  peers:
    port_name: raft
    via_proxy: true
  start: ["${binary}", "${data_dir}", "${port}", "${peers}"]
  ready:
    file: "${data_dir}/ready"
    contains: READY
    timeout: 2s
fault:
  isolate:
    node: node_0
    direction: both
  after:
    file:
      glob: "${dir}/cut_now"
      contains: NOW
      poll: 10ms
      timeout: 5s
check:
  rules:
    - else: FAIL
