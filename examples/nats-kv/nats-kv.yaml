# 3-node nats-server JetStream KV, replicas 3.
# cluster.listen is ${port_cluster} (proxy upstream). cluster.advertise and
# routes use the peer-proxy addresses, so Raft and route dials enter the proxy.
# Client listen is ${client_port}. client_advertise is the client proxy.
# The monitor port is not proxied. Not run in CI.
name: nats-kv
binary:
  default: nats-server
  extra: ["./examples/nats-kv/nats-server"]
topology:
  nodes: 3
  client_via_proxy: true
  data_dir: "${dir}/node${i}"
  ports:
    base: 0
    client_base: 0
    names: [cluster, monitor]
  proxy_mode: per_node_owned
  peers:
    port_name: cluster
    via_proxy: true
  start:
    - /bin/sh
    - examples/nats-kv/start-node.sh
    - "${i}"
    - "${data_dir}"
    - "${binary}"
    - "${port_cluster}"
    - "${port_monitor}"
    - "${client_port}"
    - "${node_proxy_addr_${i}}"
    - "${client_proxy}"
    - "${peer_addr_0}"
    - "${peer_addr_1}"
    - "${peer_addr_2}"
  ready:
    command:
      - /bin/sh
      - examples/nats-kv/ready.sh
      - "${i}"
      - "${client_port}"
      - "${port_monitor}"
    contains: READY
    timeout: 30s
  stop_grace: 2s
nemesis:
  warmup: 4s
  duration: 25s
  interval: 3s
  quiet_period: 5s
  actions:
    - type: isolate_node
      target: random
      mode: blackhole
      weight: 3
    - type: partition_halves
      mode: reset
      weight: 2
    - type: kill_node
      target: random
      restart_delay: 2s
      weight: 2
    - type: heal_all
      weight: 2
workload:
  driver: exec_op
  workers: 4
  rate: 20
  keyspace: 3
  timeout: 2000ms
  targets: "${client_addrs}"
  exec:
    put:
      - /bin/sh
      - examples/nats-kv/kv-op.sh
      - put
      - "${target}"
      - "${key}"
      - "${value}"
    get:
      - /bin/sh
      - examples/nats-kv/kv-op.sh
      - get
      - "${target}"
      - "${key}"
properties:
  always:
    - porcupine:
        timeout: 10s
    - set: {}
  eventually:
    - eventually_available:
        n: 5
  sometimes:
    - fault_during_inflight: {}
      min_hits: 1
    - info_ops_observed: {}
      min_hits: 1
    - fault_action_fired:
        action: isolate_node
      min_hits: 1
