name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Build
      run: go build -v -o fuss .

    - name: Run go vet
      run: go vet ./...

    # Unit tests only. Tests that need a real Dagu/rqlited binary skip when
    # those binaries are not on PATH (needDagu / ResolveBinary).
    - name: Run unit tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.txt
        flags: unittests
        name: codecov-umbrella
