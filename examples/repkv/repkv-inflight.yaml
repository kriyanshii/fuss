name: repkv
binary:
  default: repkv
  extra: ["./examples/repkv/repkv"]
topology:
  nodes: 3
  data_dir: "${dir}/node${i}"
  ports:
    base: 0
  peers:
    port_name: raft
    via_proxy: true
  start:
    - /bin/sh
    - -c
    - |
      ${binary} -id ${i} -data-dir ${data_dir} -peer-listen 127.0.0.1:${port} -peer-addrs '${peer_addr_0},${peer_addr_1},${peer_addr_2}' -client 127.0.0.1:0 -mode hold -gate ${dir}/replicated &
      pid=$!
      if [ "${i}" = "0" ]; then
        ${binary} -inflight -dir ${dir} -n 3 -key ${seed}-0 -cut ${dir}/cut_now -gate ${dir}/replicated &
      fi
      wait $pid
  ready:
    file: "${data_dir}/ready"
    contains: READY
    timeout: 5s
  stop_grace: 500ms
fault:
  isolate: node_0
  after:
    file:
      glob: "${dir}/cut_now"
      contains: NOW
      poll: 10ms
      timeout: 8s
kill:
  at: file
  file:
    glob: "${dir}/drive_done"
    contains: DONE
    poll: 10ms
    timeout: 20s
check:
  command:
    command: ["${binary}", "-verify", "-porcupine", "-dir", "${dir}", "-n", "3", "-key", "${seed}-0", "-initial", ""]
    as: out
  rules:
    - if: { out_contains: "history unknown" }
      verdict: UNKNOWN
    - if: { out_contains: "history illegal" }
      verdict: ILLEGAL
    - if: { out_contains: "history legal" }
      verdict: PASS
    - else: FAIL
